name: BUILD - SM8550 Kernel

on:
    workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
    - name: Install required packages
      run: |
        sudo apt update
        sudo apt install -y build-essential libgmp-dev libmpfr-dev libmpc-dev libisl-dev libncurses5-dev bc git bison flex zstd
        sudo apt install -y clang gcc make gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi
        sudo apt install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

    - name: Build Image and modules headers
      run: |
        git clone https://github.com/porserversss/sm8550-mainline.git -b sheng-6.14 src --depth=1
        mkdir -p out artifacts/{modules,headers,kernel,dtb}

        cd src
        cp arch/arm64/configs/sm8550.config ../out/.config
        make O=../out CC=clang ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig
        make O=../out CC=clang ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- -j"$(nproc --all)"
        make O=../out CC=clang ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- modules_prepare -j"$(nproc --all)"
        make O=../out CC=clang ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- modules_install INSTALL_MOD_PATH=../artifacts/modules -j"$(nproc --all)"
        make O=../out CC=clang ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- headers_install INSTALL_HDR_PATH=../artifacts/headers -j"$(nproc --all)"

        echo "[ BUILD ]: Kernel compile done"

        cd ../artifacts
        cp -rf ../out/arch/arm64/boot/Image* kernel/
        cp -rf ../out/arch/arm64/boot/dts/* dtb/

        echo "[ BUILD ]: compressing modules"
        tar -cJf ../modules.tar.xz modules
        echo "[ BUILD ]: compressing headers"
        tar -cJf ../headers.tar.xz headers
        echo "[ BUILD ]: compressing kernel image"
        tar -cJf ../kernel.tar.xz kernel
        echo "[ BUILD ]: compressing dtb"
        tar -cJf ../dtb.tar.xz dtb

        echo "[ BUILD ]: compressing all artifacts"
        tar -cJf ../artifacts.tar.xz .

        echo "[ BUILD ]: Done"

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        path: artifacts.tar.xz
